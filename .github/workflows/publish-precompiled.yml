name: Publish Precompiled Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag della release (es. v3.9.6). Vuoto per fallire: un default avrebbe creato una release fasulla."
        required: true
        default: ""

jobs:
  publish-release:
    name: Create GitHub Release with Precompiled Files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verifica il tag
        id: tag
        env:
          RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')"
          [[ "$tag" == v* ]] || tag="v$tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$RAW' non valido ('$tag'): la forma attesa e' vX.Y.Z"
            exit 1
          fi
          [[ "$tag" == "$RAW" ]] || echo "::warning::Tag '$RAW' normalizzato a '$tag'"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            myplaylist-linux-x64.tar.gz
            myplaylist-windows-x64.zip
            myplaylist-macos.zip
            # Se preferisci inserire i file compilati in una cartella specifica, puoi usare un pattern del tipo:
            # precompiled-releases/*
          fail_on_unmatched_files: false
          generate_release_notes: true
